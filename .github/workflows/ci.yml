name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Generated files, tests, fixture build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 22
      - name: Generated files are up to date
        run: npm run check
      - name: Tests
        run: npm test
      - name: Build the fixture site from the packed theme
        working-directory: fixture
        run: |
          npm ci --no-audit --no-fund
          (cd .. && npm pack --pack-destination fixture)
          npm install --no-save --no-audit --no-fund ./bynk-lang-site-theme-*.tgz
          npm run build
